name: MQ Probe

# Runs on BOTH triggers so the payload difference is directly observable.
# Question 1: does a merge_group carry a PR number / title?
# Question 2: can a PR-identity-bound check (title lint, comment gate) survive one?

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  probe:
    name: Probe gate
    runs-on: ubuntu-latest
    steps:
      - name: Dump event context
        uses: actions/github-script@v8
        with:
          script: |
            const e = context.eventName;
            const p = context.payload;
            const hr = p.merge_group?.head_ref ?? '';
            const m = hr.match(/pr-(\d+)-/);
            const rows = [
              ['event_name', e],
              ['github.ref', context.ref],
              ['github.sha', context.sha.slice(0, 12)],
              ['payload keys', Object.keys(p).join(' ')],
              ['pull_request.number', String(p.pull_request?.number ?? 'ABSENT')],
              ['pull_request.title', String(p.pull_request?.title ?? 'ABSENT')],
              ['merge_group.head_ref', String(p.merge_group?.head_ref ?? 'ABSENT')],
              ['merge_group.base_sha', String(p.merge_group?.base_sha?.slice(0, 12) ?? 'ABSENT')],
              ['merge_group.head_sha', String(p.merge_group?.head_sha?.slice(0, 12) ?? 'ABSENT')],
              ['PR recovered from ref', m ? m[1] : 'N/A'],
            ];
            for (const [k, v] of rows) core.notice(`${k} = ${v}`);
            await core.summary
              .addHeading(`MQ Probe - ${e}`, 3)
              .addTable([
                [{ data: 'field', header: true }, { data: 'value', header: true }],
                ...rows.map(([k, v]) => [k, String(v)]),
              ])
              .write();

  title:
    name: Title check
    runs-on: ubuntu-latest
    steps:
      - name: Mimic a PR-title lint
        uses: actions/github-script@v8
        with:
          script: |
            const t = context.payload.pull_request?.title;
            const re = /^(feat|fix|chore|docs|refactor|test|ci)(\([\w\-. ]+\))?: .+/;
            if (!t) {
              core.warning(
                'No PR title in this event. A real title lint has nothing to read here ' +
                'and would fail or error. Passing so the rest of the probe can complete.');
              await core.summary.addRaw('**Title check:** no title available in this event.').write();
              return;
            }
            core.notice(`title = ${t}`);
            if (!re.test(t)) core.setFailed(`title does not match convention: ${t}`);
