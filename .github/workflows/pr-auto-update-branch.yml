name: Auto-Update PR Branches (lab port)

# When main advances (any PR merge), every other open PR becomes out-of-date.
# (Releases no longer merge into main — tag-release just tags the already-merged
# SHA and cuts a GitHub release, so it isn't a trigger here.) If branch protection
# requires "branches up to date before merging", each PR must be updated by hand
# before its auto-merge can proceed.
# This workflow updates the OLDEST ELIGIBLE such PR, one per run. The rest stay behind
# main on purpose - strict up-to-date already blocks them, so rebasing them now only
# discards a gate run they would have to repeat after the front PR merges.
#
# NOTE: it uses the RELEASE GitHub App token (not GITHUB_TOKEN) on purpose — a branch
# push made with GITHUB_TOKEN does NOT re-trigger CI, so required checks would never
# re-run and auto-merge would stall. The App token makes CI re-run so auto-merge lands.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be updated without calling update-branch'
        type: boolean
        default: false

# Only care about the latest state of main; supersede in-flight runs.
concurrency:
  group: pr-auto-update-branch
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

jobs:
  update-auto-merge-prs:
    name: Update stale auto-merge PR branches
    runs-on: ubuntu-latest
    steps:
      - name: Select the front PR
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BASE_FIELDS=number,title,headRefName,headRepositoryOwner,autoMergeRequest,isDraft,mergeable
          SEL='[.[] | select(.autoMergeRequest != null)]'
          ERR=$(mktemp)

          # statusCheckRollup needs checks/actions/statuses read. If any of them is
          # missing the whole query 403s, so fall back to selecting without check
          # state rather than failing the run - a missing statusCheckRollup makes the
          # failing-check filter below a no-op, everything else still works.
          if ALL=$(gh pr list --repo "${REPO}" --base main --state open --limit 100 \
                     --json "${BASE_FIELDS},statusCheckRollup" --jq "${SEL}" 2>"${ERR}"); then
            FILTER_MODE="active"
          else
            echo "::warning::Could not read check state: $(tr -d '\n' < "${ERR}" | cut -c1-300)"
            ALL=$(gh pr list --repo "${REPO}" --base main --state open --limit 100 \
                    --json "${BASE_FIELDS}" --jq "${SEL}")
            FILTER_MODE="DEGRADED - no check state, a failing PR will not be skipped"
          fi

          echo "Failing-check filter: ${FILTER_MODE}"

          echo "Open auto-merge PR(s) targeting main: $(echo "${ALL}" | jq 'length')"

          FRONT=$(echo "${ALL}" | jq -c '[.[]
            | select(.isDraft | not)
            | select(.mergeable != "CONFLICTING")
            | select([.statusCheckRollup[]?
                | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"
                      or .state == "FAILURE" or .state == "ERROR")] | length == 0)
            ] | sort_by(.number) | first')

          if [ "${FRONT}" = "null" ]; then
            echo "${ALL}" | jq -r '.[] | "  #\(.number) waiting"'
            echo "No eligible PR at the front. Nothing to update."
            exit 0
          fi

          NUM=$(echo "${FRONT}" | jq -r '.number')
          HEAD=$(echo "${FRONT}" | jq -r '.headRefName')
          OWNER=$(echo "${FRONT}" | jq -r '.headRepositoryOwner.login')

          echo "${ALL}" | jq -r --argjson n "${NUM}" \
            '.[] | "  #\(.number) " + (if .number == $n then "front" else "waiting" end)'

          if ! BEHIND=$(gh api "repos/${REPO}/compare/main...${OWNER}:${HEAD}" --jq '.behind_by' 2>"${ERR}"); then
            echo "::warning::Could not read behind_by for #${NUM} (${OWNER}:${HEAD}): $(tr -d '\n' < "${ERR}")"
            exit 0
          fi

          case "${BEHIND}" in
            ''|*[!0-9]*)
              echo "::warning::#${NUM}: unexpected behind_by '${BEHIND}'"
              exit 0
              ;;
          esac

          echo "front=#${NUM} behind_by=${BEHIND}"

          if [ "${BEHIND}" -eq 0 ]; then
            echo "#${NUM} is up to date. Nothing to update."
            exit 0
          fi

          {
            echo "number=${NUM}"
            echo "behind=${BEHIND}"
          } >> "${GITHUB_OUTPUT}"

      - name: Update the front PR's branch
        if: steps.select.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.select.outputs.number }}
          BEHIND: ${{ steps.select.outputs.behind }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN - would PUT repos/${REPO}/pulls/${NUM}/update-branch (behind ${BEHIND})"
            exit 0
          fi

          if gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/pulls/${NUM}/update-branch"; then
            echo "Requested branch update for #${NUM} (was behind ${BEHIND})."
          else
            echo "::warning::Could not update #${NUM} - likely a merge conflict; resolve manually."
          fi
